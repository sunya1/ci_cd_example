name: shaders_and_render_object
description: "Custom fragment shaders (.frag) integrated into the Flutter rendering pipeline, with performance measurement."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.0-290.4.beta

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Each .frag is compiled by `impellerc` at BUILD time into a per-backend
  # bundle (SkSL / MSL / GLSL ES / SPIR-V) and shipped as an asset.
  shaders:
    - shaders/plasma.frag
    - shaders/ripple.frag
    - shaders/glitch.frag
